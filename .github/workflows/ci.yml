name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Test (no cgo)
        run: CGO_ENABLED=0 go test ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.out

  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build (no cgo)
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (no cgo)
        run: |
          set -o pipefail
          CGO_ENABLED=0 go test -v -count=1 ./... 2>&1 | tee test-os.log
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Failed tests"
            grep -E '^--- FAIL:|^FAIL[[:space:]]|^panic:' test-os.log | head -50 || true
            echo "### Log tail"
            tail -80 test-os.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          grep -B12 -E '^--- FAIL:' test-os.log | head -15 | while IFS= read -r line; do
            echo "::error title=Test failure::$line"
          done
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-os-${{ matrix.os }}
          path: test-os.log
          if-no-files-found: ignore

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  cross:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build all targets
        run: |
          set -e
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
            done
          done

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fuzz
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/go-pdf-fuzz.log
          : > "$log"
          trap 'status=$?; if [ $status -ne 0 ]; then tail -40 "$log" | while IFS= read -r line; do echo "::error title=Fuzz failure::$line"; done; fi' EXIT
          run_fuzz() {
            echo "=== $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
          }
          run_fuzz go test ./internal/syntax -run=^$ -fuzz=FuzzParseObject -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/syntax -run=^$ -fuzz=FuzzOpenFile -fuzztime=20s -parallel=4
          run_fuzz go test . -run=^$ -fuzz=FuzzEncryptedOpen -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/filter -run=^$ -fuzz=FuzzDecodeFilters -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/filter -run=^$ -fuzz=FuzzPredictor -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/content -run=^$ -fuzz=FuzzContentLexer -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/font -run=^$ -fuzz=FuzzParseToUnicode -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/font -run=^$ -fuzz=FuzzPredefinedSplit -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/font -run=^$ -fuzz=FuzzParseEmbeddedCMap -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/font -run=^$ -fuzz=FuzzSFNTRepair -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/image -run=^$ -fuzz=FuzzImageDecode -fuzztime=20s -parallel=4
          run_fuzz go test ./internal/function -run=^$ -fuzz=FuzzPostScript -fuzztime=20s -parallel=4
      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Run benchmarks
        run: go test ./... -run=^$ -bench=. -benchmem -count=1 | tee bench.txt
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare with G0 baseline
        run: benchstat docs/perf/g1-bench.txt bench.txt | tee benchstat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            bench.txt
            benchstat.txt

  deps:
    name: Dependency whitelist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check go.mod
        run: ./scripts/check-deps.sh
      - name: Check Core/provider separation
        run: ./scripts/check-core-deps.sh
